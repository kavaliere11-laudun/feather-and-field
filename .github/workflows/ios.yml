# Feather & Field as an iPhone app: built on one of GitHub's Macs (free for a public repository) and tried on an iPhone
# simulator there. The game inside is the published one (main's 3d/ folder), wrapped by app/ (Capacitor; app/README.md).
# The pictures, a short film of the app running and the logs are kept with the run ("Artifacts": iphone-check) and on the
# branch app-check (replaced each time), where Claude can read them.
# No secrets here: this build is unsigned and never leaves GitHub. Sending a build to Apple (TestFlight) will be its own
# job, using a key Audrey adds in the repository's settings (Settings > Secrets), never written in this repository.
name: iPhone app
on:
  push:
    branches: [source]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also send a build to Apple (TestFlight)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: write      # (only to put the pictures on the branch app-check)
    steps:
      - name: The app's project (source branch)
        uses: actions/checkout@v4
        with:
          sparse-checkout: app
      - name: The game as published (main branch, 3d/)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: 3d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: |
          mkdir -p shots
          xcodebuild -version
          xcrun simctl list runtimes
      - name: The app's web folder and the iPhone project
        working-directory: app
        run: |
          npm ci
          node make-www.mjs ../site/3d
          npx cap sync ios
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          for want in ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16"):
              hit = [x for x in phones if x["name"] == want]
              if hit: print(hit[-1]["udid"]); break
          else: print(phones[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Build for the simulator
        working-directory: app/ios/App
        run: |
          xcodebuild -list -project App.xcodeproj
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > ../../../shots/build-log.txt 2>&1 \
            || { tail -n 80 ../../../shots/build-log.txt; exit 1; }
          tail -n 15 ../../../shots/build-log.txt
          test -d "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
      - name: Try it on the simulator (English, then French)
        timeout-minutes: 15
        run: |
          set -x
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          ID=com.featherandfield.game
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          for L in en fr; do
            xcrun simctl uninstall "$UDID" $ID || true
            xcrun simctl install "$UDID" "$APP"
            LOC=en_GB; [ $L = fr ] && LOC=fr_FR
            xcrun simctl launch "$UDID" $ID -AppleLanguages "($L)" -AppleLocale $LOC
            sleep 2;  xcrun simctl io "$UDID" screenshot shots/$L-0-opening.png
            sleep 50; xcrun simctl io "$UDID" screenshot shots/$L-1-welcome.png
            xcrun simctl terminate "$UDID" $ID || true
          done
      - name: A farm in the app (a test farm put in for this check only)
        timeout-minutes: 15
        working-directory: app
        run: |
          set -x
          FARM=test/farm30.json node make-www.mjs ../site/3d
          npx cap copy ios
          (cd ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 5)
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          ID=com.featherandfield.game
          xcrun simctl uninstall "$UDID" $ID || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" $ID -AppleLanguages "(en)" -AppleLocale en_GB
          sleep 90; xcrun simctl io "$UDID" screenshot ../shots/en-2-farm.png
          xcrun simctl io "$UDID" recordVideo --codec h264 --force ../shots/farm.mov & REC=$!
          sleep 20; kill -INT $REC; wait $REC || true
          xcrun simctl io "$UDID" screenshot ../shots/en-3-farm-later.png
          xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'process == "App"' > ../shots/app-log.txt || true
          tail -n 60 ../shots/app-log.txt || true
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-check
          path: shots/
          retention-days: 14
      - name: Keep the pictures on the branch app-check
        if: always()
        working-directory: shots
        run: |
          echo "iPhone check: run ${{ github.run_number }} (${{ github.run_id }}) of ${{ github.sha }}, $(date -u)" > README.md
          git init -q -b app-check && git config user.name "iPhone check" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "iPhone check, run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-check

  # A signed build sent to App Store Connect, for TestFlight and then the store: run by hand ("Run workflow", tick
  # TestFlight) or by a push whose message has [testflight]. It needs four secrets Audrey adds herself in the repository's
  # Settings > Secrets and variables > Actions (never written here, never sent to anyone): ASC_KEY_ID, ASC_ISSUER_ID and
  # ASC_KEY_P8 (an App Store Connect API key, Admin, its .p8 file's text) and APPLE_TEAM_ID. Xcode signs in the cloud with
  # them (automatic signing); the build number is the run's number. The archive is made unsigned and signed only when it's
  # exported for the store (a development signature at archive time needs a registered iPhone: "Your team has no devices",
  # first try, 5 Nov 2026); pipefail, so a failed archive or upload fails the job (the first try showed green).
  testflight:
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]'))
    runs-on: macos-26
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: The key from Apple is there
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || { echo "missing secret: $v"; exit 1; }; done
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: 3d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The app's web folder and the iPhone project
        working-directory: app
        run: |
          npm ci
          node make-www.mjs ../site/3d
          npx cap sync ios
      - name: Build, sign and send to App Store Connect
        working-directory: app/ios/App
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -n 30
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 30
          rm -f "$KEY"

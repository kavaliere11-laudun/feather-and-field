# Feather & Field as an iPhone app: built on one of GitHub's Macs (free for a public repository) and tried on an iPhone
# simulator there. The game inside is the published one (main's 3d/ folder), wrapped by app/ (Capacitor; app/README.md).
# The pictures and a short film of the app running are kept with the run ("Artifacts": iphone-check).
# No secrets here: this build is unsigned and never leaves GitHub. Sending a build to Apple (TestFlight) will be its own
# job, using a key Audrey adds in the repository's settings (Settings > Secrets), never written in this repository.
name: iPhone app
on:
  push:
    branches: [source]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: The app's project (source branch)
        uses: actions/checkout@v4
        with:
          sparse-checkout: app
      - name: The game as published (main branch, 3d/)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: 3d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: The app's web folder and the iPhone project
        working-directory: app
        run: |
          npm ci
          node make-www.mjs ../site/3d
          npx cap sync ios
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          for want in ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16"):
              hit = [x for x in phones if x["name"] == want]
              if hit: print(hit[-1]["udid"]); break
          else: print(phones[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Build for the simulator
        working-directory: app/ios/App
        run: |
          xcodebuild -list -project App.xcodeproj
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
      - name: Try it on the simulator (English, then French)
        run: |
          set -x
          mkdir -p shots
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          ID=com.featherandfield.game
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          for L in en fr; do
            xcrun simctl uninstall "$UDID" $ID || true
            xcrun simctl install "$UDID" "$APP"
            LOC=en_GB; [ $L = fr ] && LOC=fr_FR
            xcrun simctl launch "$UDID" $ID -AppleLanguages "($L)" -AppleLocale $LOC
            sleep 2;  xcrun simctl io "$UDID" screenshot shots/$L-0-opening.png
            sleep 50; xcrun simctl io "$UDID" screenshot shots/$L-1-welcome.png
            xcrun simctl terminate "$UDID" $ID || true
          done
      - name: A farm in the app (a test farm put in for this check only)
        working-directory: app
        run: |
          set -x
          FARM=test/farm30.json node make-www.mjs ../site/3d
          npx cap copy ios
          (cd ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 5)
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          ID=com.featherandfield.game
          xcrun simctl uninstall "$UDID" $ID || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" $ID -AppleLanguages "(en)" -AppleLocale en_GB
          sleep 90; xcrun simctl io "$UDID" screenshot ../shots/en-2-farm.png
          xcrun simctl io "$UDID" recordVideo --codec h264 --force ../shots/farm.mov & REC=$!
          sleep 20; kill -INT $REC; wait $REC || true
          xcrun simctl io "$UDID" screenshot ../shots/en-3-farm-later.png
          xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'process == "App"' > ../shots/app-log.txt || true
          tail -n 60 ../shots/app-log.txt || true
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-check
          path: shots/
          retention-days: 14

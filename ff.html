<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feather & Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Feather & Field: the farm fills the screen; a glassy HUD and dock float over it; menus slide up as rounded sheets.
   Type: Fredoka (rounded display, numbers, buttons) + Nunito (body). Colour: meringue panels, hedge-green ink,
   barn-red actions, yolk for coins and progress, meadow green for good news. */
:root{
  --meringue:#fffdf7; --sage:#eef2e4; --sage-2:#e2e9d4; --ink:#1e3426; --ink-2:#5f6f5c; --line:#d9e1c9;
  --barn:#d2462f; --barn-deep:#a8331f; --meadow:#3f8f4e; --meadow-deep:#2e6e3b; --yolk:#f5b92e; --yolk-deep:#c98d0c; --pond:#4fa3c7;
  --glass:rgba(255,253,247,.8); --glass-top:rgba(255,253,247,.93); --glass-line:rgba(255,255,255,.7); --shadow:0 10px 30px rgba(20,40,20,.18);
  --paper:var(--meringue); --paper-2:var(--sage); --good:var(--meadow); --warn:#b36a00; --bad:var(--barn);
  --coin:var(--yolk); --coin-2:var(--yolk-deep);
  --r1:#d2462f; --r2:#2f6cc0; --r3:#e8b322;
  --display:'Fredoka','Baloo 2',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hedge-2:rgba(30,52,38,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --meringue:#18241c; --sage:#223228; --sage-2:#2b3d31; --ink:#eef0e6; --ink-2:#a9b8a5; --line:#34483a;
  --glass:rgba(24,36,28,.78); --glass-top:rgba(24,36,28,.92); --glass-line:rgba(255,255,255,.08); --warn:#f0b24a; --hedge-2:rgba(255,255,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --meringue:#18241c; --sage:#223228; --sage-2:#2b3d31; --ink:#eef0e6; --ink-2:#a9b8a5; --line:#34483a;
  --glass:rgba(24,36,28,.78); --glass-top:rgba(24,36,28,.92); --glass-line:rgba(255,255,255,.08); --warn:#f0b24a; --hedge-2:rgba(255,255,255,.08); color-scheme:dark}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{background:#4f7a35;overflow:hidden;overscroll-behavior:none}     /* nothing scrolls under the status bar, so iOS has no edge to blur */
body{margin:0;background:#4f7a35;color:var(--ink);font-family:var(--body);font-weight:600;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:relative;height:100%}
/* installed on the home screen (iPhone draws the page under the status bar, and 100% then falls short of the bottom): fill the whole screen */
@media (display-mode: standalone){#app{position:fixed;inset:0 0 auto 0;height:100vh}}
.standalone #app{position:fixed;inset:0 0 auto 0;height:100vh}
/* iOS 26 blurs the top of home-screen apps unless something opaque is painted right at the top edge */
html{background:#4f7a35}
@media (display-mode: standalone){#app{background:#4f7a35}}
.standalone #app{background:#4f7a35}
#noblur{display:none}
@supports (-webkit-touch-callout: none){@media (display-mode: standalone){#noblur{display:block;position:fixed;top:0;left:0;right:0;height:11px;z-index:50;pointer-events:none;background:#4f7a35;-webkit-background-clip:text;background-clip:text;color:transparent}}
  .standalone #noblur{display:block;position:fixed;top:0;left:0;right:0;height:11px;z-index:50;pointer-events:none;background:#4f7a35;-webkit-background-clip:text;background-clip:text;color:transparent}}
.standalone,.standalone body{min-height:calc(100% + env(safe-area-inset-top,0px))}
#stage{position:absolute;inset:0;overflow:hidden;background:#4f7a35}
#farm{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* floating HUD */
.topbar{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 7px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass-top);box-shadow:var(--shadow);color:var(--ink);font:600 15px var(--display);font-variant-numeric:tabular-nums;cursor:pointer}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffeeb0,var(--yolk) 55%,var(--yolk-deep));box-shadow:inset 0 -2px 0 rgba(120,80,0,.3),inset 0 0 0 2.5px rgba(150,100,0,.45),inset 0 0 0 4px rgba(255,240,180,.55);flex:none;display:inline-block;vertical-align:-6px;position:relative}
.pill .coin::after{content:"";position:absolute;inset:7px;background:rgba(150,100,0,.5);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.price .coin{width:17px;height:17px;vertical-align:-3px}
.egg{width:20px;height:24px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 30%,#fff,#efe3cd 70%,#cdb994);flex:none;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass-top);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.pill.lvl{padding:0 13px 0 4px}
.ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--yolk) calc(var(--p,0)*1%),var(--hedge-2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--meringue)}

/* floating dock */
.tabbar{position:absolute;z-index:6;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:24px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--shadow);color:var(--ink);max-width:560px;margin-inline:auto}
.tabbar button{position:relative;border:0;background:transparent;color:var(--ink-2);font:600 11.5px/1 var(--display);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 5px;border-radius:18px;cursor:pointer;transition:color .2s}
.tabbar svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"]::before{content:"";position:absolute;top:2px;left:50%;width:46px;height:32px;margin-left:-23px;border-radius:14px;background:color-mix(in srgb,var(--yolk) 45%,transparent);z-index:-1}
.tabbar button[aria-current="true"] svg{transform:translateY(-1px) scale(1.06)}
.badge{position:absolute;top:0;right:calc(50% - 26px);min-width:19px;height:19px;border-radius:10px;background:var(--barn);color:#fff;font:700 11px/19px var(--display);padding:0 5px;box-shadow:0 0 0 2px var(--meringue);font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:3px solid var(--pond);outline-offset:2px}

#moveBar{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;padding:12px 14px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-line);box-shadow:var(--shadow);max-width:440px;margin:0 auto}
#moveBar p{margin:0 0 10px;font:600 14px var(--display);color:var(--ink)}
#moveBar .row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
body:has(#moveBar:not([hidden])) #farmBtns{display:none}
#farmBtns{position:absolute;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:4}
.fbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--glass-line);border-radius:999px;padding:0 14px 0 11px;height:42px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);font:600 14px var(--display);box-shadow:var(--shadow);cursor:pointer}
.fbtn svg{width:19px;height:19px}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--meringue);border-color:transparent}

#toasts{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px;z-index:7}
.toast{background:rgba(30,52,38,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#f6f4ea;padding:10px 16px;border-radius:16px;font:600 14px var(--display);max-width:440px;text-align:center;box-shadow:var(--shadow);animation:tin .3s cubic-bezier(.3,1.4,.5,1)}
.toast.act{display:flex;align-items:center;gap:12px;pointer-events:auto;text-align:left;padding-right:8px}
.toastbtn{border:0;border-radius:999px;padding:8px 14px;background:var(--yolk);color:#3a2800;font:700 13px var(--display);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.toast.gold{background:#fff1c7;color:#4a3405}
.toast.gold .toastbtn{background:var(--ink);color:#fff}
@keyframes tin{from{transform:translateY(-10px) scale(.96);opacity:0}}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(15,28,18,.32);z-index:19;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--meringue);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:20;animation:sup .32s cubic-bezier(.2,1.1,.3,1)}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:var(--line)}
@keyframes sup{from{transform:translateY(60px);opacity:.3}}
@media (min-width:760px){
  #sheet{left:auto;right:16px;top:calc(64px + env(safe-area-inset-top,0px));bottom:16px;width:440px;max-height:none;border-radius:28px;box-shadow:var(--shadow);animation-name:sin}
  #sheet::before{display:none}
  #scrim{background:transparent;pointer-events:none}
  .tabbar{right:472px;margin:0}
  body:has(#sheet:not([hidden])) #farmBtns{right:472px}
}
@keyframes sin{from{transform:translateX(40px);opacity:.3}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:22px 18px 8px}
.sheet-head h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;margin:0;flex:1;text-wrap:balance;min-width:0}
.sheet-head .iconbtn{background:var(--sage);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#sheetBody{overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:6px 0 0}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
p{margin:0;line-height:1.5}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.card{background:var(--sage);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;isolation:isolate}
.card .card,.card .item{background:var(--meringue)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:18px;background:var(--sage);border:0;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;min-width:0;transition:transform .15s}
.item:active{transform:scale(.985)}
.item .name{font:600 16px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait{width:58px;height:58px;border-radius:16px;background:radial-gradient(ellipse at 50% 88%,#c2dc98,#eef5df 72%);flex:none;object-fit:contain;padding:3px;-webkit-user-drag:none;user-select:none}
.portrait.chick{padding:9px}
.portrait.big{width:136px;height:136px;border-radius:24px}
.portrait.live{position:relative;display:block;overflow:hidden}
.portrait.live .pf{position:absolute;inset:3px;transform-origin:50% 90%;animation:breathe 3.4s ease-in-out infinite}
.portrait.live.chick .pf{inset:9px;animation-duration:1.6s}
.portrait.live img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden;-webkit-user-drag:none;user-select:none}
.portrait.live img.on{visibility:visible}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.016)}}

/* buttons: chunky and pressable */
.btn{border:0;border-radius:999px;padding:12px 18px;font:600 16px var(--display);cursor:pointer;background:var(--barn);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;box-shadow:inset 0 -4px 0 var(--barn-deep),0 3px 8px rgba(160,40,20,.18);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--barn-deep)}
.btn.alt{background:var(--meringue);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),inset 0 -4px 0 var(--line)}
.good-t{color:var(--meadow-deep);font-weight:700}
.btn.good{background:var(--meadow);box-shadow:inset 0 -4px 0 var(--meadow-deep),0 3px 8px rgba(30,90,40,.18)}
.btn.armed{background:#8a2414;box-shadow:inset 0 -4px 0 #5c1609;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.18)}}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.textbtn{border:0;background:none;padding:6px;font:600 15px var(--display);color:var(--meadow-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center}
.btn.sm{padding:8px 13px;font-size:14px;min-height:40px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
.seg{display:flex;background:var(--sage);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink-2);font:600 14px var(--display);padding:9px 6px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--meringue);color:var(--ink);box-shadow:0 2px 6px rgba(20,40,20,.12)}
.tag{display:inline-block;font:600 12px var(--display);padding:3px 9px;border-radius:999px;background:var(--meringue);color:var(--ink-2);white-space:nowrap}
.card .tag{background:var(--meringue)}.card .tag.good{background:var(--meadow);color:#fff}.tag.good{background:var(--meadow);color:#fff}
.card .chip{background:var(--meringue)}.card .chip[aria-pressed="true"]{background:var(--ink);color:var(--meringue)}
.planrow{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1.5px solid var(--line)}.planrow p{margin:0}
.tree{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 14px minmax(0,1fr);grid-auto-rows:1fr;row-gap:6px;align-items:center}
.tnode{background:var(--meringue);border:0;border-radius:12px;padding:6px 8px;text-align:left;font:inherit;color:var(--ink);min-width:0;display:flex;flex-direction:column;gap:1px}
button.tnode{cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.tnode b{font:600 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tnode span{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode.me{background:var(--ink);color:var(--meringue)}.tnode.me span{color:#cbd6c3}.tnode.unk{color:var(--ink-2);opacity:.65}
.tbr{position:relative;align-self:stretch}.tbr::after{content:'';position:absolute;left:6px;right:0;top:25%;bottom:25%;border:2px solid var(--line);border-right:0;border-radius:6px 0 0 6px}.tbr::before{content:'';position:absolute;left:0;width:7px;top:calc(50% - 1px);border-top:2px solid var(--line)}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.skopt{background:var(--meringue);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;justify-content:space-between}.skopt .big{font:700 20px var(--display)}.skopt .btn{width:100%}
.tag.pers{background:#f6ecd4;color:#5a3d06}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 6px}
.pick-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border-radius:18px;border:2px solid transparent;background:var(--meringue);font:700 16px var(--display);color:var(--ink-2);cursor:pointer}
.pick-tile img{height:150px;width:auto;object-fit:contain}
.pick-tile[aria-pressed="true"]{border-color:var(--good);background:#eef6e6}
.pick-tile:focus-visible{outline:3px solid var(--good);outline-offset:2px}.tag.red{background:var(--r1);color:#fff}.tag.blue{background:var(--r2);color:#fff}.tag.gold{background:var(--yolk);color:#3a2a00}
.grade{font:700 15px var(--display);min-width:36px;text-align:center;padding:4px 7px;border-radius:12px;background:var(--meringue);font-variant-numeric:tabular-nums}
.grade.gs{background:var(--yolk);color:#3a2a00}.grade.gAp,.grade.gA{background:var(--meadow);color:#fff}.grade.gB{background:#2a7a8c;color:#fff}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.meter{height:10px;border-radius:5px;background:var(--sage-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#9cc76a,var(--meadow));border-radius:5px}
.meter.hi i{background:linear-gradient(90deg,var(--yolk),var(--barn))}
.meter.xp i{background:linear-gradient(90deg,#ffd76a,var(--yolk-deep))}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:5px;background:var(--sage-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--yolk);transition:width .5s linear}
.price{display:inline-flex;align-items:center;gap:5px;font:600 15px var(--display);font-variant-numeric:tabular-nums}
.eggdot{width:18px;height:23px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;flex:none;box-shadow:inset -3px -4px 6px rgba(0,0,0,.18),inset 3px 3px 5px rgba(255,255,255,.5)}
.rosette{--c:var(--r1);position:relative;width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--c) 0 30%,#fffbea 31% 37%,transparent 38%),repeating-conic-gradient(var(--c) 0 12deg,color-mix(in srgb,var(--c) 72%,#000) 12deg 24deg)}
.rosette::after{content:"";position:absolute;left:8px;top:22px;width:14px;height:14px;background:linear-gradient(90deg,var(--c) 0 45%,transparent 45% 55%,var(--c) 55%);clip-path:polygon(0 0,100% 0,100% 100%,75% 80%,50% 100%,25% 80%,0 100%);z-index:-1}
details.howto>p{margin:8px 0 0}details.howto>summary{font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}details.howto>summary::-webkit-details-marker{display:none}details.howto>summary::after{content:'▾';transition:transform .2s}details.howto:not([open])>summary::after{transform:rotate(-90deg)}
.rosette.p2{--c:var(--r2)}.rosette.p3{--c:var(--r3)}.rosette.p0{--c:#9aa39a}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trophies .card{align-items:center;text-align:center;gap:6px}
.big-num{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.check{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--sage-2);color:transparent;font:700 13px var(--display)}
.check.on{background:var(--meadow);color:#fff}
.thumb{width:100%;aspect-ratio:340/170;border-radius:16px;display:block;background:linear-gradient(#93bd62,#6f9d45);object-fit:cover;object-position:50% 45%}
.thumb.dim{filter:grayscale(.7) brightness(.95)}
input[type=text]{font:600 17px var(--display);padding:11px 14px;border-radius:16px;border:2px solid var(--line);background:var(--meringue);color:var(--ink);width:100%;min-width:0}
.note{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.warn{color:var(--warn);font-weight:700;font-size:13.5px}
.hero-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.feedbar{display:flex;height:14px;border-radius:7px;background:var(--sage-2);overflow:hidden}
.feedbar i{display:block;height:100%}
.sack{width:30px;height:32px;flex:none;background:var(--c);clip-path:polygon(20% 8%,50% 0,80% 8%,96% 92%,50% 100%,4% 92%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.tag.lock{background:var(--sage-2);color:var(--ink-2)}
.card.locked{opacity:.75}
.thumb.dc{object-fit:contain;padding:6px 10px;box-sizing:border-box}
.outfits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.outfit{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 8px}
.outfit img{height:130px;width:100%;object-fit:contain}
.outfit.on{outline:2px solid var(--good);outline-offset:-2px;background:#eef6e6}
.outfit .tiny{min-height:2.6em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.colours{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.colour{background:var(--meringue);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.colour img{width:74px;height:62px;object-fit:contain}
.colour.unseen img{filter:brightness(0) opacity(.22)}
.tiny{font-size:11.5px;line-height:1.3}
.portrait.cat{width:112px;height:98px}
.levelcard{gap:12px}
.lvlbig{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffeeb0,var(--yolk) 60%,var(--yolk-deep));color:#3a2a00;font:700 26px var(--display);flex:none;box-shadow:inset 0 -4px 0 rgba(120,80,0,.25),0 4px 12px rgba(200,140,0,.3)}
.lvlbig.xl{width:110px;height:110px;font-size:52px;animation:pop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
.levelhero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:7px 13px;background:var(--sage);color:var(--ink);font:600 13.5px var(--display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--meringue)}
@media (max-width:430px){.brand{font-size:0;flex:1}.topbar{gap:6px;padding-inline:10px}.pill{padding-right:11px;height:36px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const hatch = () => { sparkle(); ui(t => { const d = out(.1, .2); for (let i = 0; i < 3; i++) { const tt = t + .25 + i * .17, o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(3600, tt); o.frequency.exponentialRampToValueAtTime(4300, tt + .03); o.frequency.exponentialRampToValueAtTime(3300, tt + .1); env(g.gain, tt, .01, .8, .1); o.connect(g); g.connect(d); o.start(tt); o.stop(tt + .15); } }); };

  /* ---------- music: an unhurried country tune in G that never quite repeats ---------- */
  const CH = { G: [55, 59, 62], Em: [52, 55, 59], C: [48, 52, 55], D: [50, 54, 57], Am: [57, 60, 64], Bm: [50, 54, 59] };
  const PROG = [['G', 'Em', 'C', 'D'], ['G', 'C', 'G', 'D'], ['C', 'G', 'Am', 'D'], ['Em', 'C', 'G', 'D'], ['G', 'Bm', 'C', 'D']];

/* =====================================================================
   11. CLOCK AND START
   ===================================================================== */
function tickTime() {
  const now = Date.now(); let d = now - state.lastReal;
  if (d < 0) { state.lastReal = now; return; }        // device clock moved backwards: award nothing
  if (d < 40) return;
  state.lastReal = now;
  const away = d > 15000;
  const paused = d > OFFLINE_CAP;
  const game = Math.min(d * state.speed, OFFLINE_CAP);
  if (away) { sink = { any: false }; advance(game); const s = sink; sink = null; if (s.any && (d > 5 * MIN || s.hatched || s.shows || s.levels)) { s.real = Math.min(d, OFFLINE_CAP); s.paused = paused; if (!current || current.name !== 'welcome') openSheet('away', s); } changed(); }
  else advance(game);
  if (state.speed === 1 && Math.abs(state.epoch + state.gt - now) > 5 * MIN) state.epoch = now - state.gt;     // keep day and night on the player's own clock
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; clock += dt;
  tickTime();
  stepInertia(dt);
  updateAgents(dt);
  updateFarmer(dt);
  updateHearts(dt);
  updateLife(dt);
  SND.tick(dt);
  draw();

  if (dirty) { dirty = false; uiDirty = true; buildPlots(); updateHud(); }
  requestAnimationFrame(frame);
}
// safety net: a farm with no feed, empty feeders and too few coins to buy a bag would be stuck for good, so a neighbour helps out (once a day)
function neighbourHelp() {
  if (!state.coops.length || state.feed.basic > 0 || state.coins >= FEEDS.basic.price) return;
  if (state.coops.some(c => feederTotal(c) > 0) || state.gt - (state.helpAt ?? -1e13) < DAY) return;
  state.helpAt = state.gt; state.feed.basic += FEEDS.basic.bag; toast(t('neighbour'), true); changed();
}
setInterval(() => { if (!state) return; checkTrophies(); neighbourHelp(); updateTimers(); updateHud(); if (current && uiDirty && !(document.activeElement && document.activeElement.id === 'rename')) { uiDirty = false; renderSheet(); } }, 1000);
setInterval(save, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });

function start(hotData) {

}

})();

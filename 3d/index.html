<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f7a35">
<title>Feather &amp; Field · 3D village (test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root { --ink: #1e3426; --meringue: #fffdf7; --yolk: #f5b92e; --barn: #d2462f; --meadow: #3f8f4e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8cb85c; overscroll-behavior: none; }
  body { font-family: Nunito, system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  #farm { position: fixed; inset: 0; display: block; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20, 40, 15, 0.22) 100%); }
  .top { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 10px); display: flex; justify-content: center; gap: 8px; pointer-events: none; }
  .pill { pointer-events: auto; background: rgba(255, 253, 247, 0.9); border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: 15px;
          box-shadow: 0 2px 10px rgba(30, 52, 38, 0.15); text-decoration: none; color: var(--ink); }
  .title { font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 17px; }
  #readout { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px); white-space: nowrap;
             font-size: 13px; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #readout.slow { background: var(--barn); color: #fff; }
  #hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translate(-50%, -6px); max-width: calc(100vw - 32px);
          background: rgba(30, 52, 38, 0.92); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 15px; text-align: center;
          opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; }
  #hint.on { opacity: 1; transform: translate(-50%, 0); }
  #tag { position: fixed; left: 0; top: 0; padding: 7px 13px; border-radius: 999px; background: var(--meringue); font-weight: 800; font-size: 15px;
         box-shadow: 0 2px 8px rgba(30, 52, 38, 0.2); opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #tag.on { opacity: 1; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             background: #8cb85c; transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .msg { font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 20px; color: var(--meringue); text-align: center; padding: 0 24px; }
  #loading .bar { width: 200px; height: 10px; border-radius: 99px; background: rgba(255, 253, 247, 0.35); overflow: hidden; }
  #loading .fill { width: 0; height: 100%; background: var(--yolk); transition: width .2s; }
  #inside-top { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 10px); display: flex; justify-content: center; pointer-events: none; }
  #inside-back { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); font-size: 16px;
                 padding: 12px 22px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; }
  #inside-top[hidden], #inside-back[hidden] { display: none; }
  #farmerbtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); font-size: 17px;
               padding: 13px 24px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; background: var(--yolk); color: var(--ink);
               box-shadow: 0 3px 14px rgba(245, 185, 46, 0.45); white-space: nowrap; }
  #farmerbtn[hidden] { display: none; }
  body.inside #farmerbtn { display: none; }
  #foxbtn.alarm { background: var(--barn); color: #fff; border: 0; }
  body.inside .top { display: none; }
  #fade { position: fixed; inset: 0; background: #0d1320; opacity: 0; pointer-events: none; transition: opacity .28s; }
  #fade.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #hint, #tag, #loading, #fade { transition: none; } }
</style>
</head>
<body>
<canvas id="farm"></canvas>
<div class="vignette"></div>
<div class="top"><span class="pill title">3D village</span><button id="foxbtn" class="pill" type="button" hidden>Foxes</button><a class="pill" href="../">Back to the game</a></div>
<div id="inside-top" hidden><span class="pill title" id="inside-title"></span></div>
<button id="inside-back" class="pill" type="button" hidden>Back to the farm</button>
<button id="farmerbtn" class="pill" type="button" hidden>Send the farmer</button>
<div id="fade"></div>
<div id="hint" role="status"></div>
<div id="tag"></div>
<button id="readout" class="pill" type="button" aria-label="How smooth the farm is (tap for details)">Starting…</button>
<div id="loading"><div class="msg">Loading the village…</div><div class="bar"><div class="fill"></div></div></div>
<script src="app.js?v=1792754088"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f7a35">
<title>Feather &amp; Field · 3D village (test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root { --ink: #1e3426; --meringue: #fffdf7; --yolk: #f5b92e; --barn: #d2462f; --meadow: #3f8f4e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8cb85c; overscroll-behavior: none; }
  body { font-family: Nunito, system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  #farm { position: fixed; inset: 0; display: block; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20, 40, 15, 0.22) 100%); }
  .top { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 10px); display: flex; justify-content: center; gap: 8px; pointer-events: none; }
  .pill { pointer-events: auto; background: rgba(255, 253, 247, 0.9); border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: 15px;
          box-shadow: 0 2px 10px rgba(30, 52, 38, 0.15); text-decoration: none; color: var(--ink); }
  .title { font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 17px; }
  #readout { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px); white-space: nowrap;
             font-size: 13px; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #readout.slow { background: var(--barn); color: #fff; }
  #hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translate(-50%, -6px); max-width: calc(100vw - 32px);
          background: rgba(30, 52, 38, 0.92); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 15px; text-align: center;
          opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; }
  #hint.on { opacity: 1; transform: translate(-50%, 0); }
  #tag { position: fixed; left: 0; top: 0; padding: 7px 13px; border-radius: 999px; background: var(--meringue); font-weight: 800; font-size: 15px;
         box-shadow: 0 2px 8px rgba(30, 52, 38, 0.2); opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #tag.on { opacity: 1; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             background: #8cb85c; transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .msg { font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 20px; color: var(--meringue); text-align: center; padding: 0 24px; }
  #loading .bar { width: 200px; height: 10px; border-radius: 99px; background: rgba(255, 253, 247, 0.35); overflow: hidden; }
  #loading .fill { width: 0; height: 100%; background: var(--yolk); transition: width .2s; }
  #inside-top { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 10px); display: flex; justify-content: center; pointer-events: none; }
  #inside-back { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); font-size: 16px;
                 padding: 12px 22px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; }
  #inside-top[hidden], #inside-back[hidden] { display: none; }
  #farmerbtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); font-size: 17px;
               padding: 13px 24px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; background: var(--yolk); color: var(--ink);
               box-shadow: 0 3px 14px rgba(245, 185, 46, 0.45); white-space: nowrap; }
  #farmerbtn[hidden] { display: none; }
  body.inside #farmerbtn { display: none; }
  #foxbtn.alarm { background: var(--barn); color: #fff; border: 0; }
  body.inside .top { display: none; }
  #fade { position: fixed; inset: 0; background: #0d1320; opacity: 0; pointer-events: none; transition: opacity .28s; }
  #fade.on { opacity: 1; }
  /* the farm dog's name: a button after tapping him, and a little card to type a new one in */
  #dogbtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); font-size: 16px;
            padding: 12px 22px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; white-space: nowrap;
            max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #dogname { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translateX(-50%); width: min(340px, calc(100vw - 32px));
             background: var(--meringue); border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 18px rgba(30, 52, 38, 0.25);
             display: flex; flex-direction: column; gap: 10px; margin: 0; z-index: 5; }
  #dogname label { font-weight: 800; font-size: 15px; }
  #dogname input { font: inherit; font-size: 17px; font-weight: 700; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(30, 52, 38, 0.22);
                   background: #fff; color: var(--ink); width: 100%; -webkit-user-select: text; user-select: text; }
  #dogname input:focus { outline: none; border-color: var(--meadow); }
  #dogname .row { display: flex; gap: 10px; justify-content: flex-end; }
  #dogname .row button { font-size: 16px; padding: 10px 18px; border: 0; cursor: pointer; font-family: inherit; }
  #dogname-save { background: var(--yolk) !important; }
  #dogbtn[hidden], #dogname[hidden] { display: none; }
  /* after tapping a hen by day: send the farmer into her pen for a cuddle, or to fill the feeder (the game's own words) */
  #henbtns { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); display: flex; gap: 10px;
             max-width: calc(100vw - 32px); }
  #henbtns button { font-size: 16px; padding: 12px 18px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; white-space: nowrap; }
  #cuddlebtn { background: #ffd6df !important; }
  #henbtns[hidden] { display: none; }
  body.inside #henbtns, body.replaying #henbtns { display: none; }
  /* the morning replay of last night's fox visit, as an old silent film (replay.js); the title cards in IM Fell English
     (old printing types, SIL Open Font License: fonts/OFL-IM-Fell.txt), kept here with the page */
  @font-face { font-family: Fell; src: url(fonts/fell-italic.woff) format('woff'); font-style: italic; font-weight: 400; font-display: swap; }
  @font-face { font-family: Fell; src: url(fonts/fell.woff) format('woff'); font-style: normal; font-weight: 400; font-display: swap; }
  #replaybtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 58px); font-size: 17px;
               padding: 13px 24px; border: 0; cursor: pointer; font-family: Nunito, system-ui, sans-serif; white-space: nowrap;
               background: #2b2118; color: #f6e7c4; box-shadow: 0 3px 14px rgba(43, 33, 24, 0.4); }
  #replaybtn[hidden], #film[hidden] { display: none; }
  #farm.film { filter: sepia(0.92) contrast(1.16) brightness(1.62) saturate(0.82); }
  html:has(body.replaying), body.replaying { background: #0b0805; }          /* (the gate weave shows no green at the edges) */
  body.replaying .top, body.replaying #readout, body.replaying #farmerbtn, body.replaying #dogbtn, body.replaying #hint, body.replaying .vignette { display: none; }
  #film { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
  #film > * { position: absolute; }
  #film-grain { inset: 0; width: 100%; height: 100%; opacity: 0.55; }
  #film-flick { inset: 0; opacity: 0; }
  .film-scratch { top: 0; bottom: 0; width: 1.5px; background: rgba(250, 240, 215, 0.85); opacity: 0; }
  #film-s2 { background: rgba(30, 20, 8, 0.8); width: 1px; }
  #film-vig { inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(26, 16, 6, 0.55) 86%, rgba(14, 9, 3, 0.85) 100%); }
  #film-iris { inset: 0; }
  #film-card { inset: 0; display: flex; align-items: center; justify-content: center; background: #0f0b07; opacity: 0; transition: opacity .25s; padding: 24px; }
  #film-card.on { opacity: 1; }
  #film-card .frame { width: min(340px, 100%); padding: 34px 22px; border: 2px solid #d9c7a0; outline: 1px solid #d9c7a0; outline-offset: 5px;
                      text-align: center; color: #efe3c6; font-family: Fell, Didot, Baskerville, Georgia, serif; }
  #film-card .frame::before, #film-card .frame::after { content: '❦'; display: block; font-size: 22px; color: #cdb98f; line-height: 1; }
  #film-card .frame::before { margin-bottom: 18px; } #film-card .frame::after { margin-top: 18px; transform: scaleX(-1); }
  #film-title { margin: 0; font-size: 27px; line-height: 1.3; font-style: italic; }
  #film-sub { margin: 16px 0 0; font-size: 18px; line-height: 1.35; color: #d8c8a2; font-style: italic; }
  #film-card.end #film-title { font-size: 44px; font-style: normal; letter-spacing: 0.04em; }
  #film-skip { right: 14px; bottom: calc(env(safe-area-inset-bottom) + 16px); pointer-events: auto; font-family: Fell, Georgia, serif;
               font-size: 17px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(239, 227, 198, 0.55); background: rgba(15, 11, 7, 0.55);
               color: #efe3c6; cursor: pointer; z-index: 2; }

  /* ---- the game (play.html: body.game): the 2D game's look; the test page's own buttons hidden */
  body.game { --sage: #eef2e4; --ink-2: #5f6f5c; --line: #d9e1c9; --yolk-deep: #c98d0c; --glass-top: rgba(255, 253, 247, 0.93);
              --glass-line: rgba(255, 255, 255, 0.7); --shadow: 0 10px 30px rgba(20, 40, 20, 0.18); --display: 'Fredoka', system-ui, sans-serif; }
  body.game .top, body.game #readout { display: none !important; }
  body.game #hint { top: calc(env(safe-area-inset-top) + 62px); }
  .gbar { position: fixed; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
          padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none; }
  .gbar > * { pointer-events: auto; }
  .gbar[hidden] { display: none; }
  body.inside .gbar, body.replaying .gbar { display: none; }
  .gbrand { font-family: var(--display); font-weight: 600; font-size: 20px; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); white-space: nowrap;
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .gpill { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px 0 7px; border-radius: 999px; border: 1px solid var(--glass-line);
           background: var(--glass-top); box-shadow: var(--shadow); color: var(--ink); font: 600 15px var(--display); font-variant-numeric: tabular-nums; cursor: pointer; }
  .glvl { padding: 0 13px 0 4px; }
  .gring { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--yolk) calc(var(--p, 0) * 1%), rgba(30, 52, 38, 0.08) 0); display: grid; place-items: center; flex: none; }
  .gring::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--meringue); }
  .gcoin { width: 24px; height: 24px; border-radius: 50%; flex: none; position: relative;
           background: radial-gradient(circle at 35% 30%, #ffeeb0, var(--yolk) 55%, var(--yolk-deep));
           box-shadow: inset 0 -2px 0 rgba(120, 80, 0, 0.3), inset 0 0 0 2.5px rgba(150, 100, 0, 0.45), inset 0 0 0 4px rgba(255, 240, 180, 0.55); }
  .gcoin::after { content: ""; position: absolute; inset: 7px; background: rgba(150, 100, 0, 0.5);
                  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .gicon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass-top); box-shadow: var(--shadow); color: var(--ink);
           display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
  .gicon svg { width: 20px; height: 20px; }
  @media (max-width: 430px) { .gbrand { font-size: 0; } .gbar { gap: 6px; padding-inline: 10px; } }
  .gdim { position: fixed; inset: 0; z-index: 19; background: rgba(20, 35, 20, 0.35); }
  .gdim[hidden], .gsheet[hidden] { display: none; }
  .gsheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62%; z-index: 20; background: var(--meringue); color: var(--ink); border-radius: 28px 28px 0 0;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; font-family: Nunito, system-ui, sans-serif; }
  .gsheet.modal { max-height: 92%; }
  .gsheet.in { animation: gsup 0.32s cubic-bezier(0.2, 1.1, 0.3, 1); }
  @keyframes gsup { from { transform: translateY(100%); } to { transform: none; } }
  .gsheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px; background: var(--line); }
  .gsheet-head { display: flex; align-items: center; gap: 10px; padding: 22px 18px 4px; }
  .gsheet-head h2 { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.1; margin: 0; flex: 1; min-width: 0; }
  .gsheet .gx { background: var(--sage); border: 0; box-shadow: none; }
  .gsheet .gx[hidden] { display: none; }
  .gsheet-body { overflow-y: auto; padding: 4px 16px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch;
                 -webkit-user-select: none; user-select: none; }
  .gtext { margin: 0; font-size: 15.5px; line-height: 1.4; font-weight: 600; }
  .gsub { margin: 0; color: var(--ink-2); font-weight: 700; font-size: 15px; }
  .gnote { margin: 0; color: var(--ink-2); font-size: 14px; font-weight: 600; }
  .gwarn { color: #b36a00; }
  .gver { font-size: 12.5px; opacity: 0.8; }
  .gforever { margin: 0; font-weight: 800; color: var(--meadow); font-size: 14.5px; }
  .gheart { color: #e0566f; }
  .glabel { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .gsec { margin-top: 4px; }
  .gcard { background: var(--sage); border-radius: 18px; padding: 11px 14px; display: flex; flex-direction: column; gap: 5px; }
  .gcard-h { display: flex; align-items: center; gap: 8px; }
  .gcard-t { font-family: var(--display); font-weight: 600; font-size: 19px; }
  .gemoji { font-size: 22px; line-height: 1; }
  .gstars { font-size: 24px; letter-spacing: 3px; color: #c9c2a8; line-height: 1; }
  .gstars .on { color: var(--yolk); }
  .ghearts { font-size: 21px; color: #d9b2ba; letter-spacing: 2px; line-height: 1; }
  .ghearts .on { color: #e0566f; }
  .grow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .gchips { display: flex; gap: 8px; flex-wrap: wrap; }
  .gchip { font: 600 15px var(--display); padding: 9px 15px; border-radius: 999px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .gchip.on { border-color: var(--meadow); background: #e5f1df; }
  .gwho { gap: 10px; }
  .gwho .gchip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 18px; font-size: 17px; }
  .ginput { font: 700 17px Nunito, system-ui, sans-serif; padding: 11px 13px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink);
            width: 100%; -webkit-user-select: text; user-select: text; }
  .ginput:focus { outline: none; border-color: var(--meadow); }
  .gbtn { font: 600 18px var(--display); padding: 14px 18px; border-radius: 999px; border: 0; background: var(--barn); color: #fff; cursor: pointer; margin-top: 6px;
          box-shadow: 0 4px 14px rgba(210, 70, 47, 0.35); }
  .gbtn.galt { background: var(--sage); color: var(--ink); box-shadow: none; font-size: 16px; }
  .gbtn.gdanger { background: var(--barn); color: #fff; }
  .ghero { position: fixed; z-index: 18; left: 0; right: 0; top: 0; height: calc(100% - 400px); min-height: 230px; overflow: hidden; background: #8cb85c; }
  .ghero[hidden] { display: none; }
  .ghero img { opacity: 0; transition: opacity 0.4s; } .ghero img.on { opacity: 1; }
  .ghero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }      /* (the picture is taller than the space: only grass goes) */
  .ghero::before { content: ""; position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top) + 120px); background: linear-gradient(rgba(25, 45, 20, 0.45), rgba(25, 45, 20, 0)); }
  .glogo, .gtag { z-index: 2; }
  .ghero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(rgba(140, 184, 92, 0), rgba(30, 52, 38, 0.18)); }
  .glogo { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 14px); text-align: center; font: 600 34px/1.05 var(--display); color: #fffdf7;
           text-shadow: 0 2px 0 rgba(120, 60, 20, 0.35), 0 3px 14px rgba(20, 40, 15, 0.55); letter-spacing: 0.01em; }
  .gtag { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 56px); text-align: center; font: 700 15px Nunito, system-ui, sans-serif; color: #fffdf7;
          text-shadow: 0 1px 8px rgba(20, 40, 15, 0.7); }
  .gsheet.gwelcome { max-height: none; }
  .gsheet.gwelcome .gsheet-head { padding-top: 18px; }
  .gbar-xp { height: 12px; border-radius: 99px; background: var(--sage); overflow: hidden; }
  .gbar-fill { height: 100%; background: var(--yolk); border-radius: 99px; }
  @media (prefers-reduced-motion: reduce) { #hint, #tag, #loading, #fade { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .gsheet.in { animation: none; } }
</style>
</head>
<body>
<canvas id="farm"></canvas>
<div class="vignette"></div>
<div class="top"><span class="pill title">3D village</span><button id="foxbtn" class="pill" type="button" hidden>Foxes</button><a class="pill" href="../">Back to the game</a></div>
<div id="inside-top" hidden><span class="pill title" id="inside-title"></span></div>
<button id="inside-back" class="pill" type="button" hidden>Back to the farm</button>
<button id="farmerbtn" class="pill" type="button" hidden>Send the farmer</button>
<button id="dogbtn" class="pill" type="button" hidden></button>
<button id="replaybtn" class="pill" type="button" hidden></button>
<div id="henbtns" hidden><button id="cuddlebtn" class="pill" type="button"></button><button id="feedbtn" class="pill" type="button"></button></div>
<form id="dogname" hidden><label for="dogname-in" id="dogname-label"></label><input id="dogname-in" type="text" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"><div class="row"><button type="button" class="pill" id="dogname-cancel"></button><button type="submit" class="pill" id="dogname-save"></button></div></form>
<div id="fade"></div>
<div id="hint" role="status"></div>
<div id="film" hidden><canvas id="film-grain" width="180" height="390"></canvas><div id="film-flick"></div><div class="film-scratch" id="film-s1"></div><div class="film-scratch" id="film-s2"></div><div id="film-vig"></div><div id="film-iris"></div><div id="film-card"><div class="frame"><p id="film-title"></p><p id="film-sub"></p></div></div><button id="film-skip" type="button"></button></div>
<div id="tag"></div>
<button id="readout" class="pill" type="button" aria-label="How smooth the farm is (tap for details)">Starting…</button>
<div id="loading"><div class="msg">Loading the village…</div><div class="bar"><div class="fill"></div></div></div>
<script src="app.js"></script>
</body>
</html>
